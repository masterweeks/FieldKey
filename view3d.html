<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FieldKey 3D View</title>
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.123/Build/Cesium/Widgets/widgets.css" />
<style>
  :root{--bg:#0E1116;--panel:rgba(14,17,22,.92);--line:#3A434F;--ink:#E9EDF2;--muted:#8B95A4;--amber:#FFB000;--red:#FF6B6B;
        --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui)}
  #view{position:absolute;inset:0}
  .bar{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:5;display:flex;align-items:center;gap:8px;
       background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--muted)}
  .bar b{color:var(--ink)}
  .bar .sp{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar button{appearance:none;border:1px solid var(--line);background:#1B212B;color:var(--ink);border-radius:9px;padding:7px 10px;font:600 12px var(--ui);cursor:pointer;white-space:nowrap}
  .msg{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .msg .card{max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;font-size:14px;line-height:1.45;color:var(--ink)}
  .msg .card h2{margin:0 0 8px;font-size:16px}
  .msg .card p{margin:0 0 10px;color:var(--muted)}
  .msg .card p:last-child{margin-bottom:0}
  .msg .card b{color:var(--ink)}
  .hidden{display:none!important}
  /* keep Google's logo and data credits visible (required), but compact */
  .cesium-viewer-bottom{bottom:calc(env(safe-area-inset-bottom) + 58px)!important;left:12px!important;right:12px!important}
  .cesium-widget-credits{font-size:10px!important}
</style>
</head>
<body>
<div id="view"></div>
<div class="bar hidden" id="bar"><span class="sp" id="where"></span><span id="used"></span><button type="button" id="recenter">Recenter</button></div>
<div class="msg" id="msg"><div class="card"><h2>Loading the 3D view…</h2><p>Photorealistic 3D from Google.</p></div></div>

<script>
/* FieldKey 3D view: Google Photorealistic 3D Tiles drawn with CesiumJS.
   Billing: Google counts one "root tileset" request per session (a session then loads tiles
   for up to 3 hours). The free allowance is 1,000 a month. This page starts at most one
   session per open panel, reuses it while you move between sites, and refuses to start one
   once this device has used its monthly limit (Settings, default 900). */
"use strict";
window.CESIUM_BASE_URL="https://cesium.com/downloads/cesiumjs/releases/1.123/Build/Cesium/";
const $=s=>document.querySelector(s);
const store={ get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
const SESSION_MS=2.75*3600*1000;          // renew a little before Google's 3-hour session ends
const FREE_PER_MONTH=1000;
function monthKey(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function used(){ return store.get("fk_3d_month","")===monthKey() ? (parseInt(store.get("fk_3d_count","0"),10)||0) : 0; }
function limit(){ const n=parseInt(store.get("fk_3d_limit","900"),10); return Math.max(0,Math.min(FREE_PER_MONTH,isNaN(n)?900:n)); }
function bump(){ const m=monthKey(); if(store.get("fk_3d_month","")!==m){ store.set("fk_3d_month",m); store.set("fk_3d_count","0"); } store.set("fk_3d_count",String(used()+1)); }
function showUsed(){ $("#used").textContent=used()+" of "+limit()+" this month"; }
function message(title,lines){
  const c=document.createElement("div"); c.className="card";
  const h=document.createElement("h2"); h.textContent=title; c.appendChild(h);
  lines.forEach(t=>{ const p=document.createElement("p"); p.innerHTML=t; c.appendChild(p); });   // lines are this page's own text
  const m=$("#msg"); m.innerHTML=""; m.appendChild(c); m.classList.remove("hidden");
}
function hideMessage(){ $("#msg").classList.add("hidden"); }

let viewer=null, tileset=null, sessionAt=0, target=null, pin=null, cesiumReady=null;

function loadCesium(){
  if(cesiumReady) return cesiumReady;
  cesiumReady=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=window.CESIUM_BASE_URL+"Cesium.js";
    s.onload=()=>res(window.Cesium); s.onerror=()=>{ cesiumReady=null; rej(new Error("load")); };
    document.head.appendChild(s);
  });
  return cesiumReady;
}

async function ensureViewer(){
  const Cesium=await loadCesium();
  if(viewer) return Cesium;
  Cesium.Ion.defaultAccessToken="";       // no Cesium ion: every pixel comes from Google's tiles
  viewer=new Cesium.Viewer("view",{
    baseLayer:false, baseLayerPicker:false, geocoder:false, homeButton:false, sceneModePicker:false,
    navigationHelpButton:false, animation:false, timeline:false, fullscreenButton:false, infoBox:false,
    selectionIndicator:false, globe:false, requestRenderMode:true, maximumRenderTimeChange:Infinity
  });
  viewer.scene.skyAtmosphere.show=true;
  viewer.scene.screenSpaceCameraController.enableCollisionDetection=true;
  return Cesium;
}

// one billed session; reused until it is near its 3-hour end
async function ensureTileset(Cesium,key){
  if(tileset && Date.now()-sessionAt<SESSION_MS) return tileset;
  if(used()>=limit()){
    message("Monthly 3D limit reached",[
      "This phone has opened <b>"+used()+"</b> 3D sessions this month, its limit of <b>"+limit()+"</b>.",
      "Google's free allowance is 1,000 a month, so FieldKey stops here to keep it free. It resets on the 1st, or you can change the limit in Settings."]);
    return null;
  }
  if(tileset){ try{ viewer.scene.primitives.remove(tileset); }catch(e){} tileset=null; }
  bump(); showUsed();                     // counted before the request so a failure can't slip past the limit
  try{
    tileset=await Cesium.createGooglePhotorealistic3DTileset(key,{showCreditsOnScreen:true});
  }catch(e){
    message("Google 3D tiles didn't load",[
      "Check that the <b>Map Tiles API</b> is enabled for your Google key, that billing is set up on its Google Cloud project, and that the key allows this site.",
      "You need a connection for the 3D view."]);
    return null;
  }
  viewer.scene.primitives.add(tileset); sessionAt=Date.now();
  return tileset;
}

async function show(lat,lng,name){
  target={lat,lng,name:String(name||"").slice(0,80)};
  $("#where").textContent=target.name||(lat.toFixed(5)+", "+lng.toFixed(5));
  const key=(store.get("fk_gkey","")||"").trim();
  if(!key){ message("Add your Google key",["The 3D view uses Google's Photorealistic 3D Tiles.","Paste your Google Maps API key in <b>Settings → Address lookup</b>, and enable the <b>Map Tiles API</b> for it in Google Cloud."]); return; }
  if(!navigator.onLine){ message("No connection",["The 3D view streams from Google and needs a connection."]); return; }
  let Cesium;
  try{ Cesium=await ensureViewer(); }catch(e){ message("3D view couldn't start",["The 3D engine didn't load. Check your connection and try again."]); return; }
  const ts=await ensureTileset(Cesium,key); if(!ts) return;
  hideMessage(); $("#bar").classList.remove("hidden"); showUsed();
  await flyTo(Cesium);
}

async function flyTo(Cesium){
  if(!target||!viewer) return;
  const {lat,lng}=target;
  // start high, then settle at the real ground height once Google's tiles there have loaded
  viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(lng,lat-0.012,2600),orientation:{heading:0,pitch:Cesium.Math.toRadians(-45),roll:0}});
  viewer.scene.requestRender();
  let ground=0;
  try{
    const c=[Cesium.Cartographic.fromDegrees(lng,lat)];
    const r=await viewer.scene.sampleHeightMostDetailed(c);
    if(r&&r[0]&&isFinite(r[0].height)) ground=r[0].height;
  }catch(e){}
  const spot=Cesium.Cartesian3.fromDegrees(lng,lat,ground);
  if(pin) viewer.entities.remove(pin);
  pin=viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(lng,lat,ground+3),
    point:{pixelSize:14,color:Cesium.Color.fromCssColorString("#FFB000"),outlineColor:Cesium.Color.fromCssColorString("#1a1300"),outlineWidth:2,disableDepthTestDistance:Number.POSITIVE_INFINITY}});
  viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(spot,60),{offset:new Cesium.HeadingPitchRange(0,Cesium.Math.toRadians(-35),420),duration:1.6});
  viewer.scene.requestRender();
}

$("#recenter").addEventListener("click",async()=>{ try{ const C=await loadCesium(); flyTo(C); }catch(e){} });

// FieldKey opens this page with ?lat=&lon=&name= and moves it with {type:"fk-3d",lat,lon,name}
window.addEventListener("message",e=>{
  if(e.origin!==location.origin) return;
  const m=e.data||{}; if(m.type!=="fk-3d") return;
  const la=+m.lat, lo=+m.lon; if(!isFinite(la)||!isFinite(lo)) return;
  show(la,lo,m.name);
});
{ const q=new URLSearchParams(location.search), la=parseFloat(q.get("lat")), lo=parseFloat(q.get("lon"));
  if(isFinite(la)&&isFinite(lo)&&Math.abs(la)<=90&&Math.abs(lo)<=180) show(la,lo,q.get("name")||"");
  else message("Pick a place",["Open the 3D view from a site or from the map."]); }
</script>
</body>
</html>
